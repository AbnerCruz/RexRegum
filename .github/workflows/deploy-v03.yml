name: Finalize Scriptura v0.3

on:
  push:
    paths:
      - '.github/workflows/deploy-v03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify v0.3
        shell: bash
        run: |
          cat .deploy-v03-final/piece-* | base64 -d > /tmp/scriptura-v03.tgz
          echo "3581f6dc4669f833cf44304e7d627094fc2b1e145ef24b5bd1687e1052762a80  /tmp/scriptura-v03.tgz" | sha256sum -c -
          mkdir -p /tmp/v03
          tar -xzf /tmp/scriptura-v03.tgz -C /tmp/v03
          echo "67c98d2f845dd84ba763449d3c120c60abba91bc4bbfcf3bbc756311693c5175  /tmp/v03/index.html" | sha256sum -c -
          echo "6fd96732abbea7d6b6199d9c2b9f08644fafe6bd4aaa3125acf8d164706598ce  /tmp/v03/README.md" | sha256sum -c -
          echo "47736e12cbfcdd517a735cf7d03d65a110b4290a8171399f15fcdd7e8e939b1b  /tmp/v03/PLANEJAMENTO.md" | sha256sum -c -
          cp /tmp/v03/index.html ./index.html
          cp /tmp/v03/README.md ./README.md
          cp /tmp/v03/PLANEJAMENTO.md ./PLANEJAMENTO.md
          rm -rf .deploy-v03-final .deploy-v03 .deploy-v02
          rm -f .github/workflows/deploy-v02.yml .github/workflows/deploy-v03.yml
          rmdir .github/workflows .github 2>/dev/null || true
      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Scriptura v0.3 — corpus de 1.118 estudos"
          git push
