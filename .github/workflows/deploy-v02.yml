name: Deploy Scriptura v0.2

on:
  push:
    paths:
      - '.github/workflows/deploy-v02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore v0.2 files
        shell: bash
        run: |
          cat \
            .deploy-v02/chunk-00 \
            .deploy-v02/chunk-01 \
            .deploy-v02/chunk-02 \
            .deploy-v02/fix03x-0 \
            .deploy-v02/fix03x-1 \
            .deploy-v02/fix03x-2 \
            .deploy-v02/fix03x-3 \
            .deploy-v02/fix03x-4 \
            .deploy-v02/fix03x-5 \
            .deploy-v02/chunk-04 \
            .deploy-v02/chunk-05 \
            .deploy-v02/chunk-06 \
            | base64 -d > /tmp/scriptura-v02.tgz
          echo 'ca8214b22a7467a3c9226a6a54462fda1d894785a2b19e8ed60b0e34f14179a0  /tmp/scriptura-v02.tgz' | sha256sum -c -
          tar -xzf /tmp/scriptura-v02.tgz -C .
          test -s index.html
          test -s README.md
          test -s PLANEJAMENTO.md
      - name: Commit v0.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md PLANEJAMENTO.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy Scriptura v0.2"
          git push
