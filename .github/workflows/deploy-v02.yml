name: Deploy Scriptura v0.2

on:
  push:
    paths:
      - '.github/workflows/deploy-v02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore v0.2 files
        shell: bash
        run: |
          cat .deploy-v02/chunk-* | base64 -d > /tmp/scriptura-v02.tgz
          tar -xzf /tmp/scriptura-v02.tgz -C .
          test -s index.html
          test -s README.md
          test -s PLANEJAMENTO.md
      - name: Commit v0.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md PLANEJAMENTO.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy Scriptura v0.2"
          git push
